name: CI
on:
  push:
    branches:
      - master
      - test-*
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        default: '"== 2.2"'

concurrency: # Cancel stale PR builds (but not push builds)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(format('[{0}]', inputs.branch || '" ~= 1.6.0"," == 2.0.0"," ~= 2.0.0"," == 2.2.0"," ~= 2.2.0","#devel"')) }}

    name: 'nim ${{matrix.branch}}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: nim-lang/setup-nimble-action@v2
        with:
          nimble-version: f1fcf01cd15383e0ce444477434717021fd954f5  # pre v0.26.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          nimble setup
          env NIMLANG="c" nimble test --requires="nim${{matrix.branch}}"
          env NIMLANG="cpp" nimble test --requires="nim${{matrix.branch}}"

      - name: Run benchmarks
        run: nimble bench -y


  lint:
    name: "Check formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check `nph` formatting
        uses: arnetheduck/nph-action@v1
        with:
          version: 0.7.0
          options: "."
